<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./static/css/styles.css">
    <script type="module" src="./static/js/cadastro_agendamentos.js" defer></script>

    <title>Clínica Vida e Saúde - Cadastro</title>
</head>

<body>
    <nav class="main-nav">
        <a class="logo" href="./agendamentos.html">Clínica Vida e Saúde</a>
        <div class="nav-links">
            <a href="./agendamentos.html">Agendamentos</a>
            <a href="./pacientes.html">Pacientes</a>

            <a href="./cadastro.html">Cadastro</a>
            <a href="./cadastro_agendamentos.html" aria-current="page">Cadastro de Agendamentos</a>
        </div>
    </nav>

    <main>
        <form class="signup-form">
            <h1 class="form-heading">Cadastro de Agendamentos</h1>

            <input type="text" name="p_cpf" placeholder="Insira o CPF do paciente">
            <input type="text" name="f_cpf" placeholder="Insira o CPF do profissional de saúde">
            <input type="date" name="date" placeholder="Insira o dia do atendimento">
            <input type="time" name="time" placeholder="Insira o horário do agendamento">

            <button type="submit">Cadastrar</button>
        </form>
    </main>

    <footer class="site-footer">
        <span>Clínica Vida e Saúde</span>
        <span>2026</span>
    </footer>
